name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  verify-package:
    name: Verify and package
    runs-on: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.LUMEN_SIGNING_RUNNER || 'windows-2025' }}
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      LUMEN_PYTHON: python

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-11
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify product versions
        run: bun scripts/release.ts version

      - name: Require existing release signing identity before release work
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          LUMEN_SIGN_CERT_SHA1: ${{ vars.LUMEN_SIGN_CERT_SHA1 }}
          LUMEN_SIGN_CERT_SUBJECT: ${{ vars.LUMEN_SIGN_CERT_SUBJECT }}
          LUMEN_SIGN_CERT_STORE: ${{ vars.LUMEN_SIGN_CERT_STORE }}
          LUMEN_SIGN_TIMESTAMP_URL: ${{ vars.LUMEN_SIGN_TIMESTAMP_URL }}
        run: bun run release:preflight

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Run unit tests
        run: bun run test

      - name: Run native answer bridge tests
        run: bun run test:answer-bridge

      - name: Run native performance and dev server tooling tests
        run: bun run test:tooling

      - name: Qualify production profiling in Edge
        run: bun run test:performance
        timeout-minutes: 5

      - name: Preserve production profiling samples
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lumen-production-profile-${{ github.run_id }}
          path: test-results/performance-results.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Run Edge functional tests in development mode
        run: bun run test:e2e
        timeout-minutes: 45

      - name: Stage sidecars
        run: bun run stage:sidecars

      - name: Verify real vendor signatures and reject modified PE bytes
        run: powershell.exe -NoProfile -File scripts/test-release-signatures.ps1

      - name: Verify actual sparse identity metadata and signing admission
        run: powershell.exe -NoProfile -File scripts/test-identity-package.ps1

      - name: Verify pinned Gateway matches compiled native admission
        working-directory: src-tauri
        run: cargo test --all-features -j 1 pinned_gateway_digest_matches_compiled_admission -- --ignored --test-threads=1

      - name: Verify pinned workers and staging integrity
        run: bun test workers/rivet-wasm.test.ts scripts/stage-rivet-engine.test.ts scripts/stage-windows-ai.test.ts workers/enrichment-queue.test.ts workers/improvement-queue.test.ts workers/lease-deadline.test.ts

      - name: Verify compiled enrichment recovery
        env:
          LUMEN_COMPILED_ENRICHMENT_TEST: '1'
        run: bun test workers/enrichment-runtime.test.ts

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Run Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --all-features

      - name: Verify compiled native enrichment consumer
        working-directory: src-tauri
        run: cargo test --all-features -j 1 compiled_enrichment_consumer -- --ignored --test-threads=1

      - name: Verify compiled native enrichment ownership and restart
        working-directory: src-tauri
        run: cargo test --all-features -j 1 rivet_worker_ -- --ignored --test-threads=1

      - name: Verify compiled improvement queue crash recovery and fencing
        working-directory: src-tauri
        run: cargo test --all-features -j 1 improvement_worker_recovers_crash_and_fences_old_generation -- --ignored --test-threads=1

      - name: Verify native answers in Edge
        run: bun run test:answer-native
        timeout-minutes: 5

      - name: Build installers
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: bun run tauri build

      - name: Build and verify signed release payload
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          LUMEN_SIGN_CERT_SHA1: ${{ vars.LUMEN_SIGN_CERT_SHA1 }}
          LUMEN_SIGN_CERT_SUBJECT: ${{ vars.LUMEN_SIGN_CERT_SUBJECT }}
          LUMEN_SIGN_CERT_STORE: ${{ vars.LUMEN_SIGN_CERT_STORE }}
          LUMEN_SIGN_TIMESTAMP_URL: ${{ vars.LUMEN_SIGN_TIMESTAMP_URL }}
        run: bun run release:build

      - name: Verify installer artifacts
        shell: pwsh
        run: |
          $nsis = @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *-setup.exe -File)
          if ($nsis.Count -ne 1 -or $nsis[0].Length -eq 0) {
            throw "Expected one non-empty NSIS installer; found $($nsis.Count)"
          }
          $nsis | Select-Object FullName, Length

      - name: Upload installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lumen-windows-x64-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            .build/release/verified.json
            .build/release/seal.json
            .build/release/provenance.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload failed Edge diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lumen-edge-failure-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lumen-windows-x64-${{ github.sha }}
          path: installers

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CERT_SHA1: ${{ vars.LUMEN_SIGN_CERT_SHA1 }}
        run: |
          mapfile -t nsis < <(find installers -type f -name '*-setup.exe' -print)
          mapfile -t reports < <(find installers -type f -name 'verified.json' -print)
          if [[ ${#nsis[@]} -ne 1 || ! -s "${nsis[0]}" ]]; then
            printf 'Expected exactly one non-empty NSIS installer, found %s\n' "${#nsis[@]}" >&2
            exit 1
          fi
          [[ ${#reports[@]} -eq 1 && -n "$RELEASE_CERT_SHA1" ]]
          jq -e --arg version "${GITHUB_REF_NAME#v}" --arg filename "$(basename "${nsis[0]}")" --arg cert "$RELEASE_CERT_SHA1" \
            '.version == 1 and .productVersion == $version and .filename == $filename and .owner.thumbprint == $cert and (.binding | startswith("lumen-release-v1:"))' "${reports[0]}"
          expected=$(jq -er '.sha256 | select(test("^[a-f0-9]{64}$"))' "${reports[0]}")
          printf '%s  %s\n' "$expected" "${nsis[0]}" | sha256sum --check --strict
          gh release create "$GITHUB_REF_NAME" "${nsis[0]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Lumen $GITHUB_REF_NAME"
