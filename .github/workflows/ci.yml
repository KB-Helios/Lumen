name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  verify-package:
    name: Verify and package
    runs-on: windows-2025
    timeout-minutes: 75
    env:
      CARGO_TERM_COLOR: always
      LUMEN_PYTHON: python

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-11
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Run unit tests
        run: bun run test

      - name: Run native answer bridge tests
        run: bun run test:answer-bridge

      - name: Run Edge end-to-end tests
        run: bun run test:e2e
        timeout-minutes: 15

      - name: Stage sidecars
        run: bun run stage:sidecars

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Run Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --all-features

      - name: Verify native answers in Edge
        run: bun run test:answer-native
        timeout-minutes: 5

      - name: Verify release version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $packageVersion = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $tauriVersion = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($packageVersion -cne $tauriVersion) {
            throw "Version mismatch: package.json=$packageVersion tauri.conf.json=$tauriVersion"
          }
          $expectedTag = "v$packageVersion"
          if ($env:RELEASE_TAG -cne $expectedTag) {
            throw "Release tag $env:RELEASE_TAG must equal $expectedTag"
          }

      - name: Build installers
        run: bun run tauri build

      - name: Verify installer artifacts
        shell: pwsh
        run: |
          $nsis = @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *-setup.exe -File)
          if ($nsis.Count -ne 1 -or $nsis[0].Length -eq 0) {
            throw "Expected one non-empty NSIS installer; found $($nsis.Count)"
          }
          $nsis | Select-Object FullName, Length

      - name: Upload installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lumen-windows-x64-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lumen-windows-x64-${{ github.sha }}
          path: installers

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t nsis < <(find installers -type f -name '*-setup.exe' -print)
          if [[ ${#nsis[@]} -ne 1 || ! -s "${nsis[0]}" ]]; then
            printf 'Expected exactly one non-empty NSIS installer, found %s\n' "${#nsis[@]}" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${nsis[0]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Lumen $GITHUB_REF_NAME"
